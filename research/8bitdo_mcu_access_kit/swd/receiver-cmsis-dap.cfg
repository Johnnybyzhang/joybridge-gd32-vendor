# 8BitDo receiver / GD32F103C8T6, CMSIS-DAP SWD.
# REQUIRED: connect a probe-supported nRESET line to target NRST (LQFP48 pin 7).
# Stock firmware disables both JTAG and SWD, so connect under hardware reset.
# This file configures access only; it does not erase, unprotect or program.
#
# An observed SW-DP ID can be supplied BEFORE this file, for example:
#   openocd -c "set CPUTAPID 0x2ba01477" -f receiver-cmsis-dap.cfg -f inspect.cfg
# Without an override, the official target script expects 0x1ba01477.
# Do not override FLASH_SIZE until physical backing/capacity is established.

source [find interface/cmsis-dap.cfg]
transport select swd
set CHIPNAME gd32f103_receiver
set WORKAREASIZE 0x1000
source [find target/stm32f1x.cfg]

# Override the target script's 1000 kHz default for initial flying-wire access.
adapter speed 100
adapter srst delay 100
adapter srst pulse_width 100
reset_config srst_only srst_nogate srst_open_drain connect_assert_srst
