# Target-flash read-only inspection. Run after receiver-cmsis-dap.cfg:
#   openocd -f receiver-cmsis-dap.cfg -l receiver-identify.log -f inspect.cfg
# Hardware reset and halt are intentional; no flash/option writes are issued.

init
reset halt
flash probe 0
flash banks
flash info 0

echo "ARM CPUID at 0xE000ED00:"
mdw 0xe000ed00 1
echo "GD32 debug/device ID at 0xE0042000:"
mdw 0xe0042000 1
echo "Density: low16 flash KiB, high16 SRAM KiB:"
mdw 0x1ffff7e0 1
echo "Active FMC_OBSTAT: bit1 security protection, bit0 complement error:"
mdw 0x4002201c 1
echo "Raw option bytes: unprotected SPC pair begins A5 5A:"
mdb 0x1ffff800 16
stm32f1x options_read 0
shutdown
